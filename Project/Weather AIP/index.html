<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="Weapperr">


        <div class="left">

            <div class="logo">
                <h2>WeatherInfo</h2>
            </div>

            <div class="weather-box">

                <div class="temp">
                    <h1>24.1°</h1>
                </div>

                <div class="city-time">
                    <h2 class="city-name">Ahmedabad</h2>
                    <p>17:28 - Saturday, 25 7 2026</p>
                </div>

                <div class="condition">
                    <img src="" alt="">
                    
                    <p class="p1">Moderate or heavy rain</p>
                </div>

            </div>

        </div>


        <div class="right">

            <div class="search-box">

                <input type="text" placeholder="Search Location....">

                <button class="btnsearch">
                     <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

            <div class="cities">

                <p>Ahmedabad</p>
                <p>Gandhinagar</p>
                <p>Surat</p>
                <p>Vadodara</p>

            </div>

            <hr>

            <div class="details">

                <h3>Weather Details</h3>

                <div class="row">
                    <span>Cloudy</span>
                    <span>100%</span>
                </div>

                <div class="row1">
                    <span>Humidity</span>
                    <span>94%</span>
                </div>

                <div class="row2">
                    <span>Wind</span>
                    <span>13.7 km/h</span>
                </div>

                <div class="row3">
                    <span>Rain</span>
                    <span>98%</span>
                </div>

            </div>

        </div>

    </div>

    <footer>
        Created with 🤍by Bhakti Dharsandiya
    </footer>

    <script src="script.js"></script>
</body>

</html>
