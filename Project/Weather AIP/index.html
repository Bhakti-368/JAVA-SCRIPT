<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

<div class="left">

<div class="logo">WeatherInfo</div>

<div class="bottom">

<div class="temp">
31.1°
</div>

<div class="city">
<h1>Rajkot</h1>
<p>14:33 - Saturday, 25 July 2026</p>
</div>

<div class="status">
<i class="fa-solid fa-cloud-sun"></i>
<p>Partly Cloudy</p>
</div>

</div>

</div>


<div class="right">

<div class="search">

<input type="text" placeholder="Search Location...">

<button>
<i class="fa-solid fa-magnifying-glass"></i>
</button>

</div>

<div class="cities">

<p>Ahmedabad</p>
<p>Gandhinagar</p>
<p>Surat</p>
<p>Vadodara</p>

</div>

<hr>

<div class="details">

<h3>Weather Details</h3>

<div class="row">
<span>Cloudy</span>
<span>75%</span>
</div>

<div class="row">
<span>Humidity</span>
<span>71%</span>
</div>

<div class="row">
<span>Wind</span>
<span>15.8 km/h</span>
</div>

</div>

<hr>

<div class="credit">
Created with ❤ by Bhakti Dharsandiya
</div>

</div>

</div>

</body>
</html>
